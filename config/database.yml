default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: knights_tour_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: knights_tour_test

production:
  primary: &primary_production
    <<: *default
    database: knights_tour_production
    host: <%= ENV["DB_HOST"] %>
    port: <%= ENV.fetch("DB_PORT") { 5432 } %>
    username: <%= ENV.fetch("POSTGRES_USER") { "knights_tour" } %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: knights_tour_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: knights_tour_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: knights_tour_production_cable
    migrations_paths: db/cable_migrate
